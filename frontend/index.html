<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="logo">🏏</div>
            <div>
                <h1>IPL Predictor</h1>
                <p>Match Outcome Analysis</p>
            </div>
        </header>

        <section class="hero">
            <p class="eyebrow">CRICKET ANALYTICS</p>
            <h2>Who will win the match?</h2>
            <p class="subtitle">
                Compare team form and historical performance.
            </p>

            <form id="prediction-form">
                <div class="team-grid">
                    <label>
                        Team 1
                        <select id="team1" required>
                            <option value="">Select first team</option>
                        </select>
                    </label>

                    <label>
                        Team 2
                        <select id="team2" required>
                            <option value="">Select second team</option>
                        </select>
                    </label>
                </div>

                <label class="date-label">
                    Match date
                    <input type="date" id="match-date" required>
                </label>

                <button type="submit" id="predict-button">
                    Predict Match Outcome
                </button>
            </form>

            <p id="status" role="status"></p>
            <section id="result" hidden aria-live="polite"></section>
        </section>

        <footer>
            Powered by FastAPI · Historical statistics, not guaranteed outcomes
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
